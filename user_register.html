<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - UMKM Desa Depok</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Poppins',sans-serif; background:linear-gradient(135deg,#2c5f2d,#1a3b1a); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
        .register-container { background:white; border-radius:32px; width:450px; max-width:100%; padding:40px 30px; box-shadow:0 25px 50px rgba(0,0,0,0.3); }
        .register-container h1 { text-align:center; color:#1a3b1a; margin-bottom:8px; }
        .register-container p { text-align:center; color:#666; margin-bottom:30px; }
        .form-group { margin-bottom:20px; }
        .form-group label { display:block; font-weight:600; margin-bottom:6px; color:#333; }
        .form-group input { width:100%; padding:12px 15px; border:2px solid #e2e8f0; border-radius:14px; font-size:15px; transition:0.3s; }
        .form-group input:focus { outline:none; border-color:#2c5f2d; box-shadow:0 0 0 3px rgba(44,95,45,0.2); }
        .btn-register { width:100%; background:linear-gradient(135deg,#2c5f2d,#1a3b1a); color:white; padding:14px; border:none; border-radius:16px; font-weight:bold; font-size:16px; cursor:pointer; transition:0.3s; }
        .btn-register:hover { transform:translateY(-2px); box-shadow:0 10px 20px rgba(44,95,45,0.3); }
        .alert { padding:12px; border-radius:14px; margin-bottom:20px; display:none; background:#fee; color:#c33; }
        .login-link { text-align:center; margin-top:20px; }
        .login-link a { color:#2c5f2d; text-decoration:none; font-weight:600; }
        @media (max-width:480px){ .register-container { padding:25px 20px; } }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>📝 Daftar Akun</h1>
        <p>Buat akun untuk mengakses halaman utama</p>
        <div id="alert" class="alert"></div>
        <form id="registerForm">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="fullname" placeholder="Masukkan nama lengkap" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Masukkan email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Minimal 6 karakter" required>
            </div>
            <div class="form-group">
                <label>Konfirmasi Password</label>
                <input type="password" id="confirm_password" placeholder="Ketik ulang password" required>
            </div>
            <button type="submit" class="btn-register">Daftar Sekarang</button>
        </form>
        <div class="login-link">Sudah punya akun? <a href="user_login.html">Login di sini</a></div>
    </div>
    <script>
        if (localStorage.getItem('userLoggedIn') || sessionStorage.getItem('userLoggedIn')) {
            window.location.href = 'index.html';
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const fullname = document.getElementById('fullname').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            const alertDiv = document.getElementById('alert');

            if (password !== confirm) {
                alertDiv.style.display = 'block';
                alertDiv.innerHTML = '❌ Password dan konfirmasi tidak cocok!';
                return;
            }
            if (password.length < 6) {
                alertDiv.style.display = 'block';
                alertDiv.innerHTML = '❌ Password minimal 6 karakter!';
                return;
            }

            let users = [];
            try {
                users = JSON.parse(localStorage.getItem('users')) || [];
            } catch(e) {
                users = [];
            }

            if (users.find(u => u.username === username)) {
                alertDiv.style.display = 'block';
                alertDiv.innerHTML = '❌ Username sudah terdaftar!';
                return;
            }
            if (users.find(u => u.email === email)) {
                alertDiv.style.display = 'block';
                alertDiv.innerHTML = '❌ Email sudah terdaftar!';
                return;
            }

            users.push({
                id: Date.now(),
                fullname,
                username,
                email,
                password,
                role: 'user',
                created_at: new Date().toISOString()
            });
            localStorage.setItem('users', JSON.stringify(users));

            alertDiv.style.display = 'block';
            alertDiv.style.background = '#d4edda';
            alertDiv.style.color = '#155724';
            alertDiv.innerHTML = '✅ Pendaftaran berhasil! Silakan login.';
            document.getElementById('registerForm').reset();

            setTimeout(() => {
                window.location.href = 'user_login.html';
            }, 1500);
        });
    </script>
</body>
</html>
