<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Produk - UMKM Desa Depok</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Poppins',sans-serif; background:#f0f7f0; }
        .navbar { background:white; padding:15px 5%; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }
        .logo-icon { background:linear-gradient(135deg,#2c5f2d,#1a3b1a); width:45px; height:45px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:white; font-size:24px; }
        .nav-links a { text-decoration:none; color:#333; margin-left:20px; font-weight:500; }
        .btn-logout { background:#f44336; padding:8px 20px; border-radius:25px; color:white!important; }
        .container { max-width:1200px; margin:0 auto; padding:30px 5%; }
        .card { background:white; border-radius:24px; padding:30px; margin-bottom:30px; box-shadow:0 5px 15px rgba(0,0,0,0.05); }
        .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px; }
        input, textarea { width:100%; padding:12px; border:2px solid #e2e8f0; border-radius:14px; font-family:inherit; }
        .btn-submit { background:#2c5f2d; color:white; padding:12px 28px; border:none; border-radius:40px; cursor:pointer; margin-top:15px; }
        table { width:100%; border-collapse:collapse; background:white; border-radius:20px; overflow:hidden; }
        th, td { padding:14px; text-align:left; border-bottom:1px solid #e2e8f0; }
        th { background:#2c5f2d; color:white; }
        .btn-edit { background:#ff9800; color:white; padding:6px 14px; border:none; border-radius:20px; cursor:pointer; margin-right:8px; }
        .btn-delete { background:#f44336; color:white; padding:6px 14px; border:none; border-radius:20px; cursor:pointer; }
        @media (max-width:768px){ th,td { font-size:12px; padding:8px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div style="display:flex;align-items:center;gap:10px">
            <div class="logo-icon">🏪</div>
            <h2>Kelola Produk</h2>
        </div>
        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="laporan.html">Laporan</a>
            <a href="#" id="logoutBtn" class="btn-logout">Logout</a>
        </div>
    </nav>
    <div class="container">
        <div class="card">
            <h2 id="formTitle">Tambah Produk Baru</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-grid">
                    <input type="text" id="name" placeholder="Nama Produk" required>
                    <input type="number" id="price" placeholder="Harga" required>
                    <input type="text" id="umkm_name" placeholder="Nama UMKM" required>
                    <input type="text" id="contact" placeholder="Kontak (WA)" required>
                    <input type="text" id="icon" placeholder="Ikon (🍜)" maxlength="2">
                </div>
                <textarea id="description" rows="3" placeholder="Deskripsi"></textarea>
                <button type="submit" class="btn-submit">Simpan</button>
            </form>
        </div>
        <div class="card">
            <h3>Daftar Produk</h3>
            <div style="overflow-x:auto">
                <table>
                    <thead>
                        <tr><th>No</th><th>Ikon</th><th>Nama</th><th>UMKM</th><th>Harga</th><th>Aksi</th></tr>
                    </thead>
                    <tbody id="productTable"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        // ================================================================
        // SOLUSI PALING AMPUH: Cek session menggunakan window.onload
        // Agar halaman benar-benar siap sebelum pengecekan
        // ================================================================
        window.onload = function() {
            const isLoggedIn = localStorage.getItem('adminLoggedIn');
            if (isLoggedIn !== 'true') {
                window.location.href = "login.html";
                return;
            }
            // Jika sudah login, jalankan script
            loadProducts();
        };

        let products = [];

        function loadProducts() {
            const stored = localStorage.getItem('umkm_products');
            if (stored) {
                products = JSON.parse(stored);
            } else {
                products = [];
            }
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('productTable');
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;">Belum ada produk</td></tr>';
                return;
            }
            tbody.innerHTML = products.map((p, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td style="font-size:24px">${p.icon || '📦'}</td>
                    <td>${p.name}</td>
                    <td>${p.umkm_name}</td>
                    <td>Rp ${p.price.toLocaleString('id-ID')}</td>
                    <td>
                        <button class="btn-edit" onclick="editProduct(${p.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteProduct(${p.id})">Hapus</button>
                    </td>
                </tr>
            `).join('');
        }

        function saveToLocal() {
            localStorage.setItem('umkm_products', JSON.stringify(products));
            renderTable();
        }

        document.getElementById('productForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const product = {
                id: id ? parseInt(id) : Date.now(),
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                price: parseInt(document.getElementById('price').value),
                icon: document.getElementById('icon').value || '📦',
                umkm_name: document.getElementById('umkm_name').value,
                contact: document.getElementById('contact').value,
                category_name: "Makanan & Minuman"
            };
            if (id) {
                const index = products.findIndex(p => p.id == id);
                if (index !== -1) products[index] = product;
            } else {
                products.push(product);
            }
            saveToLocal();
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('formTitle').innerHTML = 'Tambah Produk Baru';
        });

        function editProduct(id) {
            const p = products.find(p => p.id === id);
            if (p) {
                document.getElementById('productId').value = p.id;
                document.getElementById('name').value = p.name;
                document.getElementById('description').value = p.description;
                document.getElementById('price').value = p.price;
                document.getElementById('icon').value = p.icon;
                document.getElementById('umkm_name').value = p.umkm_name;
                document.getElementById('contact').value = p.contact;
                document.getElementById('formTitle').innerHTML = 'Edit Produk';
                window.scrollTo(0, 0);
            }
        }

        function deleteProduct(id) {
            if (confirm('Hapus produk ini?')) {
                products = products.filter(p => p.id !== id);
                saveToLocal();
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminUsername');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
