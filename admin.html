<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Produk | UMKM Desa Depok</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f0f7f0; }
        .navbar { background: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; box-shadow: 0 2px 15px rgba(0,0,0,0.05); }
        .logo-icon { background: linear-gradient(135deg, #2c5f2d, #1a3b1a); width: 45px; height: 45px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; }
        .nav-links a { text-decoration: none; color: #333; margin-left: 20px; font-weight: 500; }
        .btn-logout { background: #f44336; padding: 8px 20px; border-radius: 30px; color: white !important; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 5%; }
        .card { background: white; border-radius: 24px; padding: 30px; margin-bottom: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap: 20px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 14px; font-family: inherit; }
        .btn-submit { background: linear-gradient(135deg, #2c5f2d, #1a3b1a); color: white; padding: 12px 28px; border: none; border-radius: 40px; cursor: pointer; font-weight: 600; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 20px; overflow: hidden; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #2c5f2d; color: white; }
        .btn-edit { background: #ff9800; color: white; padding: 6px 14px; border: none; border-radius: 20px; cursor: pointer; margin-right: 8px; }
        .btn-delete { background: #f44336; color: white; padding: 6px 14px; border: none; border-radius: 20px; cursor: pointer; }
        .alert { padding: 12px; border-radius: 14px; margin-bottom: 20px; display: none; background: #d4edda; color: #155724; }
        @media (max-width: 768px) { th, td { font-size: 12px; padding: 8px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div class="logo-icon">🏪</div>
            <h2 style="color:#1a3b1a;">Kelola Produk UMKM</h2>
        </div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="index.html">Beranda</a>
            <a href="#" id="logoutBtn" class="btn-logout">Logout</a>
        </div>
    </nav>
    <div class="container">
        <div id="alert" class="alert"></div>
        <div class="card">
            <h2 id="formTitle">➕ Tambah Produk Baru</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-grid">
                    <div class="form-group"><input type="text" id="name" placeholder="Nama Produk" required></div>
                    <div class="form-group"><input type="number" id="price" placeholder="Harga (Rp)" required></div>
                    <div class="form-group"><input type="text" id="umkm_name" placeholder="Nama UMKM" required></div>
                    <div class="form-group"><input type="text" id="contact" placeholder="Kontak (WA)" required></div>
                    <div class="form-group"><input type="text" id="icon" placeholder="Ikon (🍜)" maxlength="2"></div>
                </div>
                <div class="form-group"><textarea id="description" rows="3" placeholder="Deskripsi produk"></textarea></div>
                <button type="submit" class="btn-submit">💾 Simpan Produk</button>
            </form>
        </div>
        <div class="card">
            <h3><i class="fas fa-list"></i> Daftar Produk</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead><tr><th>No</th><th>Ikon</th><th>Nama</th><th>UMKM</th><th>Harga</th><th>Aksi</th></tr></thead>
                    <tbody id="productTable"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        if (localStorage.getItem('adminLoggedIn') !== 'true') window.location.href = "login.html";

        let products = [];
        function loadProducts() {
            const stored = localStorage.getItem('umkm_products');
            if (stored) products = JSON.parse(stored);
            else {
                products = [
                    { id:1, name:"Bakso Biasa", description:"Bakso sapi kenyal", price:15000, icon:"🍜", umkm_name:"Bakso Mak Siti", contact:"0857-4871-0963" },
                    { id:2, name:"Bakso Urat", description:"Bakso urat kenyal", price:20000, icon:"🥩", umkm_name:"Bakso Mak Siti", contact:"0857-4871-0963" },
                    { id:3, name:"Mie Ayam Ceker", description:"Mie ayam ceker", price:18000, icon:"🍗", umkm_name:"Mie Ayam Mak Siti", contact:"0857-4871-0963" },
                    { id:4, name:"Es Teh Manis", description:"Teh segar", price:3000, icon:"🧋", umkm_name:"Minuman Depok", contact:"0857-4871-0963" }
                ];
                localStorage.setItem('umkm_products', JSON.stringify(products));
            }
            renderTable();
        }
        function renderTable() {
            const tbody = document.getElementById('productTable');
            if (!products.length) { tbody.innerHTML = '<tr><td colspan="6">Belum ada produk</td></tr>'; return; }
            tbody.innerHTML = products.map((p, idx) => `
                <tr>
                    <td>${idx+1}</td><td style="font-size:24px">${p.icon||'📦'}</td>
                    <td>${p.name}</td><td>${p.umkm_name}</td>
                    <td>Rp ${p.price.toLocaleString('id-ID')}</td>
                    <td><button class="btn-edit" onclick="editProduct(${p.id})">Edit</button><button class="btn-delete" onclick="deleteProduct(${p.id})">Hapus</button></td>
                </tr>
            `).join('');
        }
        function saveToLocal() { localStorage.setItem('umkm_products', JSON.stringify(products)); renderTable(); }
        document.getElementById('productForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const product = {
                id: id ? parseInt(id) : Date.now(),
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                price: parseInt(document.getElementById('price').value),
                icon: document.getElementById('icon').value || '📦',
                umkm_name: document.getElementById('umkm_name').value,
                contact: document.getElementById('contact').value
            };
            if (id) {
                const index = products.findIndex(p => p.id == id);
                if (index !== -1) products[index] = product;
                showAlert('Produk diupdate');
            } else {
                products.push(product);
                showAlert('Produk ditambahkan');
            }
            saveToLocal();
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('formTitle').innerHTML = '➕ Tambah Produk Baru';
        });
        function editProduct(id) {
            const p = products.find(p => p.id === id);
            if (p) {
                document.getElementById('productId').value = p.id;
                document.getElementById('name').value = p.name;
                document.getElementById('description').value = p.description;
                document.getElementById('price').value = p.price;
                document.getElementById('icon').value = p.icon;
                document.getElementById('umkm_name').value = p.umkm_name;
                document.getElementById('contact').value = p.contact;
                document.getElementById('formTitle').innerHTML = '✏️ Edit Produk';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
        function deleteProduct(id) {
            if (confirm('Yakin hapus produk ini?')) {
                products = products.filter(p => p.id !== id);
                saveToLocal();
                showAlert('Produk dihapus');
            }
        }
        function showAlert(msg) {
            const alertDiv = document.getElementById('alert');
            alertDiv.style.display = 'block';
            alertDiv.innerHTML = '<i class="fas fa-check-circle"></i> ' + msg;
            setTimeout(() => alertDiv.style.display = 'none', 2000);
        }
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('adminLoggedIn');
            window.location.href = 'login.html';
        });
        loadProducts();
    </script>
</body>
</html>
