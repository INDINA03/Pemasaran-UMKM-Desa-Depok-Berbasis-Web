<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun | UMKM Desa Depok</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #2c5f2d, #1a3b1a); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .register-container { background: white; border-radius: 20px; padding: 40px; width: 90%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .register-header { text-align: center; margin-bottom: 30px; }
        .register-icon { background: linear-gradient(135deg, #2c5f2d, #1a3b1a); width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; color: white; font-size: 30px; }
        .register-header h1 { color: #2c5f2d; font-size: 1.5em; }
        .register-header p { color: #666; font-size: 0.9em; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-family: inherit; transition: 0.3s; }
        .form-group input:focus { outline: none; border-color: #2c5f2d; }
        .btn-register { background: linear-gradient(135deg, #2c5f2d, #1a3b1a); color: white; width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(44,95,45,0.3); }
        .error { background: #ffebee; color: #c62828; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: none; }
        .success { background: #e8f5e9; color: #2c5f2d; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: none; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #2c5f2d; text-decoration: none; }
        .login-link { text-align: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
        .login-link a { color: #2c5f2d; text-decoration: none; font-weight: 600; }
        .login-link a:hover { text-decoration: underline; }
        .password-hint { font-size: 0.8rem; color: #999; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <div class="register-icon"><i class="fas fa-user-plus"></i></div>
            <h1>Daftar Akun Admin</h1>
            <p>Buat akun untuk mengelola UMKM Desa Depok</p>
        </div>
        <div id="errorMsg" class="error"></div>
        <div id="successMsg" class="success"></div>
        <form id="registerForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
                <div class="password-hint">Minimal 3 karakter</div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
                <div class="password-hint">Minimal 6 karakter</div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-check-circle"></i> Konfirmasi Password</label>
                <input type="password" id="confirmPassword" placeholder="Ulangi password" required>
            </div>
            <button type="submit" class="btn-register"><i class="fas fa-user-plus"></i> Daftar</button>
        </form>
        <div class="back-link">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</a>
        </div>
        <div class="login-link">
            <a href="login.html"><i class="fas fa-sign-in-alt"></i> Sudah punya akun? Login di sini</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            
            // Sembunyikan pesan sebelumnya
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // Validasi username
            if(username.length < 3) {
                errorDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Username minimal 3 karakter!';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Validasi password
            if(password.length < 6) {
                errorDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Password minimal 6 karakter!';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Validasi konfirmasi password
            if(password !== confirmPassword) {
                errorDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Password dan konfirmasi password tidak cocok!';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Ambil data akun dari localStorage
            const users = JSON.parse(localStorage.getItem('umkm_users')) || [];
            
            // Cek apakah username sudah terdaftar
            if(users.find(u => u.username === username)) {
                errorDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Username sudah terdaftar! Gunakan username lain.';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Simpan akun baru
            users.push({ username, password });
            localStorage.setItem('umkm_users', JSON.stringify(users));
            
            // Tampilkan pesan sukses
            successDiv.innerHTML = '<i class="fas fa-check-circle"></i> Pendaftaran berhasil! Silakan login.';
            successDiv.style.display = 'block';
            
            // Reset form
            document.getElementById('registerForm').reset();
            
            // Redirect ke login setelah 2 detik
            setTimeout(() => {
                window.location.href = 'login.html?registered=true';
            }, 2000);
        });
    </script>
</body>
</html>
