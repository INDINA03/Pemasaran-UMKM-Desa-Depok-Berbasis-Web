<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMKM Desa Depok</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Poppins',sans-serif; background:#f0f7f0; }
        .container { max-width:1200px; margin:0 auto; padding:30px 5%; }
        
        /* HERO */
        .hero { text-align:center; padding:40px 0 30px; }
        .hero h1 { color:#1a3b1a; font-size:2.5rem; }
        .hero p { color:#666; margin:10px 0 20px; font-size:1.1rem; }
        .hero .btn-group { display:flex; gap:15px; justify-content:center; flex-wrap:wrap; }
        .btn-primary { background:linear-gradient(135deg,#2c5f2d,#1a3b1a); color:white; padding:12px 30px; border:none; border-radius:12px; font-weight:600; cursor:pointer; transition:0.3s; text-decoration:none; display:inline-block; }
        .btn-primary:hover { transform:translateY(-3px); box-shadow:0 5px 20px rgba(44,95,45,0.3); }
        .btn-outline { background:transparent; color:#2c5f2d; padding:12px 30px; border:2px solid #2c5f2d; border-radius:12px; font-weight:600; cursor:pointer; transition:0.3s; text-decoration:none; display:inline-block; }
        .btn-outline:hover { background:#2c5f2d; color:white; }

        /* SECTION TITLE */
        .section-title { 
            text-align:center; 
            margin:40px 0 30px; 
            color:#1a3b1a; 
            font-size:1.8rem;
        }
        .section-title i { color:#2c5f2d; margin-right:10px; }

        /* PRODUCT GRID */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            margin-top: 10px;
        }
        .product-card {
            background: white;
            border-radius: 16px;
            padding: 25px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: 0.3s;
            border: 1px solid #e8f5e9;
            text-align: center;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(44,95,45,0.15);
        }
        .product-card .icon {
            font-size: 2.8rem;
            margin-bottom: 10px;
        }
        .product-card h3 {
            color: #1a3b1a;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        .product-card .price {
            color: #2c5f2d;
            font-size: 1.3rem;
            font-weight: 700;
        }
        .product-card .category {
            color: #888;
            font-size: 0.8rem;
            margin-top: 5px;
            background: #e8f5e9;
            padding: 3px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        .product-card .btn-order {
            background: linear-gradient(135deg, #2c5f2d, #1a3b1a);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            font-family: inherit;
            margin-top: 10px;
            width: 100%;
        }
        .product-card .btn-order:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(44,95,45,0.3);
        }

        .empty-products {
            text-align: center;
            padding: 50px 20px;
            color: #999;
            grid-column: 1 / -1;
        }
        .empty-products i {
            font-size: 4rem;
            display: block;
            margin-bottom: 15px;
            color: #ccc;
        }

        .footer { text-align:center; margin-top:50px; padding:20px; color:#888; border-top:1px solid #e0e0e0; }
        
        @media (max-width:768px) {
            .hero h1 { font-size:1.8rem; }
            .btn-outline { margin-top:10px; }
            .product-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width:480px) {
            .product-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HERO -->
        <div class="hero">
            <div style="font-size:4rem; margin-bottom:15px;">🏪</div>
            <h1>UMKM Desa Depok</h1>
            <p>Nikmati produk kuliner terbaik dari UMKM Desa Depok</p>
            <div class="btn-group">
                <a href="login.html" class="btn-primary"><i class="fas fa-sign-in-alt"></i> Login Admin</a>
                <a href="register.html" class="btn-outline"><i class="fas fa-user-plus"></i> Daftar Akun</a>
            </div>
        </div>

        <!-- DAFTAR PRODUK -->
        <h2 class="section-title"><i class="fas fa-utensils"></i> Produk Unggulan</h2>
        <div class="product-grid" id="productGrid">
            <!-- Produk akan muncul dari localStorage -->
        </div>

        <div class="footer">
            <p>&copy; 2026 Sistem Informasi Pemasaran UMKM Desa Depok</p>
        </div>
    </div>

    <script>
        // === AMBIL DATA PRODUK DARI LOCALSTORAGE ===
        function renderProducts() {
            const products = JSON.parse(localStorage.getItem('umkm_products')) || [];
            const grid = document.getElementById('productGrid');

            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="empty-products">
                        <i class="fas fa-utensils"></i>
                        <h3>Belum ada produk</h3>
                        <p>Silakan cek kembali nanti.</p>
                    </div>
                `;
                return;
            }

            // Icon berdasarkan kategori
            const iconMap = {
                'Makanan': '🍛',
                'Minuman': '🥤',
                'Camilan': '🍿',
                'Kue': '🍰',
                'Lainnya': '🍽️'
            };

            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="icon">${iconMap[product.kategori] || '🍽️'}</div>
                    <h3>${product.nama || 'Produk'}</h3>
                    <div class="price">Rp ${(product.harga || 0).toLocaleString('id-ID')}</div>
                    <div class="category">${product.kategori || '-'}</div>
                    <button class="btn-order" onclick="orderProduct('${product.nama}')">
                        <i class="fas fa-shopping-cart"></i> Pesan
                    </button>
                </div>
            `).join('');
        }

        // === FUNGSI PESAN ===
        function orderProduct(nama) {
            alert('🛒 Anda memesan: ' + nama + '\n\nSilakan hubungi admin untuk pemesanan.');
        }

        // === RENDER SAAT HALAMAN DIMUAT ===
        renderProducts();

        // === UPDATE OTOMATIS JIKA ADA PERUBAHAN DATA ===
        window.addEventListener('storage', function(e) {
            if (e.key === 'umkm_products') {
                renderProducts();
            }
        });

        // === CEK SETIAP 2 DETIK (UNTUK UPDATE REAL-TIME) ===
        setInterval(function() {
            renderProducts();
        }, 2000);
    </script>
</body>
</html>
