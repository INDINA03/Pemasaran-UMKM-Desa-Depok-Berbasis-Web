<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - UMKM Desa Depok</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #2c5f2d, #1a3b1a); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-card { background: white; border-radius: 32px; width: 400px; max-width: 90%; box-shadow: 0 25px 50px rgba(0,0,0,0.3); overflow: hidden; }
        .login-header { background: linear-gradient(135deg, #2c5f2d, #1a3b1a); color: white; padding: 30px; text-align: center; }
        .login-header h1 { font-size: 28px; }
        .login-body { padding: 35px 30px; }
        .input-group { margin-bottom: 25px; position: relative; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #aaa; }
        .input-group input { width: 100%; padding: 14px 15px 14px 48px; border: 2px solid #e2e8f0; border-radius: 16px; font-size: 15px; }
        .btn-login { width: 100%; background: #2c5f2d; color: white; padding: 14px; border: none; border-radius: 16px; font-weight: bold; cursor: pointer; }
        .alert { padding: 12px; border-radius: 14px; margin-bottom: 20px; display: none; background: #fee; color: #c33; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #2c5f2d; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header"><h1><i class="fas fa-lock"></i> Login Admin</h1><p>Sistem Informasi UMKM Desa Depok</p></div>
        <div class="login-body">
            <div id="alert" class="alert"></div>
            <form id="loginForm">
                <div class="input-group"><i class="fas fa-user"></i><input type="text" id="username" placeholder="Username" required></div>
                <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="password" placeholder="Password" required></div>
                <button type="submit" class="btn-login">Login</button>
            </form>
            <div class="back-link"><a href="index.html">← Kembali ke Beranda</a></div>
        </div>
    </div>
    <script>
        // Tidak ada redirect otomatis meskipun sudah login, tetap tampilkan form login.
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u === 'admin' && p === 'admin123') {
                localStorage.setItem('adminLoggedIn', 'true');
                localStorage.setItem('adminUsername', u);
                window.location.href = "dashboard.html";
            } else {
                document.getElementById('alert').innerHTML = '<i class="fas fa-exclamation-circle"></i> Username atau password salah!';
                document.getElementById('alert').style.display = 'block';
            }
        });
    </script>
</body>
</html>
