<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - UMKM Desa Depok</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #2c5f2d, #1a3b1a); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-container { background: white; border-radius: 20px; width: 400px; max-width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .login-header { background: linear-gradient(135deg, #2c5f2d, #1a3b1a); color: white; padding: 30px; text-align: center; border-radius: 20px 20px 0 0; }
        .login-body { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
        .btn-login { width: 100%; background: #2c5f2d; color: white; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .alert { padding: 12px; border-radius: 10px; margin-bottom: 20px; display: none; background: #fee; color: #c33; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #2c5f2d; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1><i class="fas fa-lock"></i> Login Admin</h1>
            <p>Sistem Informasi Pemasaran UMKM Desa Depok</p>
        </div>
        <div class="login-body">
            <div id="alert" class="alert"></div>
            <form id="loginForm">
                <div class="form-group">
                    <input type="text" id="username" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Login</button>
            </form>
            <div class="back-link">
                <a href="index.html">← Kembali ke Beranda</a>
            </div>
        </div>
    </div>
    <script>
        // Jika sebelumnya sudah login, langsung ke dashboard
        if (localStorage.getItem('adminLoggedIn') === 'true') {
            window.location.href = "dashboard.html";
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const alertDiv = document.getElementById('alert');

            if (username === 'admin' && password === 'admin123') {
                // Simpan session dengan timestamp
                localStorage.setItem('adminLoggedIn', 'true');
                localStorage.setItem('adminUsername', username);
                localStorage.setItem('adminLoginTime', Date.now());
                // Redirect ke dashboard
                window.location.href = "dashboard.html";
            } else {
                alertDiv.style.display = 'block';
                alertDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Username atau password salah!';
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
